<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" role="img" aria-labelledby="title desc">
  <title id="title">接雨水：水位由较矮的边界决定</title>
  <desc id="desc">五根柱子的示意高度为2、4、2、3、1。第三根柱子上方有一格水，水量等于min(4,3)-2=1。</desc>
  <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dce5e6" stroke-width=".6"/></pattern><pattern id="water" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#c3dfed"/><path d="M-2 10L10-2M8 12L12 8" stroke="#74a9c5" stroke-width="1"/></pattern></defs>
  <rect width="880" height="490" rx="4" fill="#f8f8f2"/>
  <rect x="1" y="1" width="878" height="488" rx="4" fill="none" stroke="#b4c5ce"/>
  <text x="30" y="38" font-family="Arial,Microsoft YaHei,sans-serif" font-size="20" font-weight="bold" fill="#27445c">接雨水 / Trapping Rain Water</text>
  <text x="30" y="63" font-family="Arial,Microsoft YaHei,sans-serif" font-size="13" fill="#6b7d86">根据手绘图整理 · 示例高度 [2, 4, 2, 3, 1]</text>
  <rect x="52" y="90" width="530" height="290" fill="url(#grid)"/>
  <g stroke="#c1cdd1" stroke-dasharray="3 5"><path d="M72 304H558M72 248H558M72 192H558M72 136H558"/></g>
  <g font-family="Arial,sans-serif" font-size="12" fill="#70828b" text-anchor="end"><text x="66" y="364">0</text><text x="66" y="308">1</text><text x="66" y="252">2</text><text x="66" y="196">3</text><text x="66" y="140">4</text></g>
  <g fill="#d4dfe2" stroke="#607e8e" stroke-width="2"><rect x="100" y="248" width="80" height="112"/><rect x="180" y="136" width="80" height="224"/><rect x="260" y="248" width="80" height="112"/><rect x="340" y="192" width="80" height="168"/><rect x="420" y="304" width="80" height="56"/></g>
  <rect x="260" y="192" width="80" height="56" fill="url(#water)" stroke="#3e89ae" stroke-width="2"/>
  <path d="M260 192H420" stroke="#256c93" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M82 360H540M534 355L540 360L534 365" fill="none" stroke="#3e596a" stroke-width="2"/>
  <g font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#36556c"><text x="140" y="385">1</text><text x="220" y="385">2</text><text x="300" y="385">3</text><text x="380" y="385">4</text><text x="460" y="385">5</text></g>
  <text x="280" y="414" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="12" fill="#6b7d86">柱子序号（从 1 开始）</text>
  <path d="M302 217L550 161H596" fill="none" stroke="#3e89ae" stroke-width="1.5"/>
  <circle cx="302" cy="217" r="3" fill="#3e89ae"/>
  <g font-family="Arial,Microsoft YaHei,sans-serif"><text x="610" y="157" font-size="16" font-weight="bold" fill="#286888">蓝色 = 接到的雨水</text><text x="610" y="197" font-size="14" fill="#4c6575">左侧最高：4</text><text x="610" y="226" font-size="14" fill="#4c6575">右侧最高：3</text><text x="610" y="255" font-size="14" fill="#4c6575">当前高度：2</text><rect x="596" y="277" width="250" height="48" fill="#f5e1c7" stroke="#d3b58e"/><text x="721" y="307" text-anchor="middle" font-size="18" font-weight="bold" fill="#8d582d">min(4, 3) − 2 = 1</text><text x="30" y="461" font-size="14" fill="#526c7a">关键：水位取决于左右边界中较矮的一侧，而不是较高的一侧。</text></g>
</svg>
