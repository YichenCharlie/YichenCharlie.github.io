name: Refresh activity and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install journal builder
        run: python -m pip install -r requirements.txt
      - name: Build journal pages
        run: |
          python scripts/test_notes.py
          python scripts/build_notes.py
      - name: Check activity collector
        run: python scripts/test_activity.py
      - name: Restore last successful activity snapshot
        uses: actions/cache@v4
        with:
          path: data/activity.json
          key: activity-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            activity-
      - name: Refresh public activity
        id: activity
        continue-on-error: true
        run: python scripts/update_activity.py
      - name: Report unavailable upstream service
        if: steps.activity.outcome == 'failure'
        run: echo '::warning::An activity service was unavailable. The last successful snapshot has been preserved.'
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp index.html credits.html travel.html .nojekyll _site/
          cp -R assets data notes _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
